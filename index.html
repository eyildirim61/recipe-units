<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tarif Ölçü Çevirici</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tarifleri su bardağı, cup ve gram arasında çevirir, porsiyonu ölçekler.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: recipe in, converted recipe out — two columns on wide screens, stacked on phones.
   Palette: porcelain white and İznik cobalt; turquoise marks approximations. */
:root {
  --bg: #f5f7fb;
  --surface: #ffffff;
  --ink: #17203a;
  --muted: #5d6680;
  --line: #dde2ee;
  --accent: #1d4fb8;
  --accent-soft: #e6edfb;
  --approx: #0b7f86;
  --warn: #9a5b00;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #161e33; --ink: #e8ecf7; --muted: #9aa4c0; --line: #29334f;
    --accent: #8fb0ff; --accent-soft: #1d2a4d; --approx: #5fd0d6; --warn: #f0b45c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #161e33; --ink: #e8ecf7; --muted: #9aa4c0; --line: #29334f;
  --accent: #8fb0ff; --accent-soft: #1d2a4d; --approx: #5fd0d6; --warn: #f0b45c; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page { max-width: 1120px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 22px; }

header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(28px, 5vw, 42px); line-height: 1.05;
  letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.tagline { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.lang button { border: 0; background: transparent; color: var(--muted); font: 600 13px var(--font-body); padding: 6px 12px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }

.controls { display: grid; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
.control-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.control-label { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); min-width: 7.5em; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px;
  padding: 7px 14px; font: 500 14px var(--font-body); cursor: pointer; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.servings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.servings input { width: 4.2em; font: 600 16px var(--font-body); padding: 6px 8px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }
.factor { font-family: var(--font-display); font-weight: 700; color: var(--accent); font-size: 18px; font-variant-numeric: tabular-nums; }

details.settings summary { cursor: pointer; color: var(--muted); font-size: 14px; }
.settings-body { display: grid; gap: 10px; margin-top: 10px; }
.settings-body p { margin: 0; color: var(--muted); font-size: 13px; max-width: 70ch; }

.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .panes { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; min-width: 0; }
.pane-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
.pane-head h2 { margin: 0; font: 700 18px var(--font-display); }
.pane-head .hint { color: var(--muted); font-size: 13px; }
.linkbtn { border: 0; background: none; color: var(--accent); font: 600 14px var(--font-body); cursor: pointer; padding: 4px 2px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--surface); border-radius: 10px;
  padding: 8px 14px; font: 600 14px var(--font-body); cursor: pointer; }
textarea { width: 100%; min-height: 360px; resize: vertical; font: 15px/1.6 var(--font-body); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
button:focus-visible, textarea:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.result { list-style: none; margin: 0; padding: 0; display: grid; }
.result li { padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.result li:last-child { border-bottom: 0; }
.result li.heading { font: 700 15px var(--font-display); padding-top: 16px; border-bottom: 0; color: var(--ink); }
.result li.note-line { color: var(--muted); font-size: 14px; }
.result li.blank { padding: 4px 0; border-bottom: 0; }
.item { display: grid; grid-template-columns: minmax(6.5em, auto) minmax(0, 1fr); gap: 4px 14px; align-items: baseline; }
.qty { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1.1; color: var(--accent);
  font-variant-numeric: tabular-nums; white-space: nowrap; }
.qty .unit { font-family: var(--font-body); font-weight: 600; font-size: 14px; color: var(--ink); margin-left: 4px; }
.qty .approx { color: var(--approx); font-size: 16px; margin-right: 2px; }
.name { font-size: 16px; overflow-wrap: anywhere; }
.name .extra { color: var(--muted); font-size: 14px; }
.meta { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); }
.meta .tag { border-radius: 6px; padding: 0 6px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.meta .tag.warn { background: transparent; color: var(--warn); border: 1px solid currentColor; }
.meta details summary { cursor: pointer; list-style: none; color: var(--approx); }
.meta details summary::-webkit-details-marker { display: none; }
.meta details[open] summary { margin-bottom: 2px; }
.basis { display: block; color: var(--muted); }
@media (max-width: 460px) {
  .item { grid-template-columns: minmax(0, 1fr); }
  .meta { grid-column: 1; }
}
.summary { color: var(--muted); font-size: 13px; }
.toast { color: var(--approx); font-weight: 600; font-size: 13px; }
footer { color: var(--muted); font-size: 13px; display: grid; gap: 6px; max-width: 80ch; }
footer a { color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .result li { animation: rise .18s ease-out both; } }
@keyframes rise { from { transform: translateY(2px); opacity: .6; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <div>
      <h1 id="title">Tarif Ölçü Çevirici</h1>
      <p class="tagline" id="tagline">Tarifi yapıştır: su bardağı, cup ve gram arasında çevirsin, porsiyonu ölçeklesin.</p>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="lang-tr" aria-pressed="true">TR</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="controls" aria-label="Seçenekler">
    <div class="control-row">
      <span class="control-label" id="lbl-target">Çevir</span>
      <div class="seg" id="target" role="group" aria-labelledby="lbl-target"></div>
    </div>
    <div class="control-row">
      <span class="control-label" id="lbl-servings">Porsiyon</span>
      <div class="servings">
        <label><span id="lbl-from">Tarif</span> <input id="from" type="number" min="1" max="200" step="1" value="4" inputmode="numeric"></label>
        <span aria-hidden="true">→</span>
        <label><span id="lbl-to">Yapacağım</span> <input id="to" type="number" min="1" max="200" step="1" value="4" inputmode="numeric"></label>
        <span class="factor" id="factor">×1</span>
      </div>
      <div class="seg" id="quick" role="group" aria-label="×"></div>
    </div>
    <details class="settings" id="settings">
      <summary id="lbl-settings">Ölçü ayarları</summary>
      <div class="settings-body">
        <div class="control-row">
          <span class="control-label" id="lbl-cup">1 su bardağı</span>
          <div class="seg" id="cup" role="group" aria-labelledby="lbl-cup"></div>
        </div>
        <div class="control-row">
          <span class="control-label" id="lbl-dessert">1 tatlı kaşığı</span>
          <div class="seg" id="dessert" role="group" aria-labelledby="lbl-dessert"></div>
        </div>
        <p id="settings-note"></p>
      </div>
    </details>
  </section>

  <div class="panes">
    <section class="pane" aria-labelledby="in-title">
      <div class="pane-head">
        <h2 id="in-title">Tarif</h2>
        <div>
          <button type="button" class="linkbtn" id="sample-tr">Örnek: kek</button>
          <button type="button" class="linkbtn" id="sample-en">Örnek: cookies</button>
          <button type="button" class="linkbtn" id="clear">Temizle</button>
        </div>
      </div>
      <textarea id="input" spellcheck="false" aria-labelledby="in-title"></textarea>
    </section>

    <section class="pane" aria-labelledby="out-title">
      <div class="pane-head">
        <h2 id="out-title">Sonuç</h2>
        <div class="pane-head">
          <span class="toast" id="toast" role="status" aria-live="polite"></span>
          <button type="button" class="btn" id="copy">Kopyala</button>
        </div>
      </div>
      <div class="summary" id="summary"></div>
      <ul class="result" id="result"></ul>
    </section>
  </div>

  <footer id="footer"></footer>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
